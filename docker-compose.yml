services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventramx}
      POSTGRES_USER: ${POSTGRES_USER:-inventramx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventramx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-inventramx}
      POSTGRES_USER: ${POSTGRES_USER:-inventramx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventramx}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      # Bound to loopback: the API is unauthenticated and intended for local use only.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      # Live-edit the static frontend without rebuilding the image.
      - ./frontend:/app/frontend:ro

volumes:
  postgres_data:
